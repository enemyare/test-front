<li class="company-list__item" [routerLink]="['/detail', company.id]">
  <img [src]="company.logo" alt="Логотип компании" class="company-list__logo"/>
  <div class="company-list__info">
    <h3 class="company-list__name">
      {{ company.suffix | companyName: company.business_name }}
    </h3>
    <p class="company-list__industry"> Вид деятельности: {{ company.industry }}</p>
    <p class="company-list__type">Тип: {{ company.type }}</p>
  </div>
</li>
