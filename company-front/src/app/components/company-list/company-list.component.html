<div class="sort-bar">
  <app-company-filter></app-company-filter>
  <app-company-sort></app-company-sort>
</div>
@if (loading()) {
  <p>Загрузка компаний...</p>
} @else if (companies()?.length) {
  <ul class="company-list">
    @for (company of companies(); track company.id) {
      <app-company-item [company]="company" />
    }
  </ul>
} @else {
  <p>Список компаний пуст</p>
}
